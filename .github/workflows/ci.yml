name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.15'
      - run: python scripts/check_readme_badges.py
      - run: python scripts/check_builder_candidates.py
      - run: python -m compileall -q app api scripts tests
      - run: python -m unittest discover -s tests -v
      - name: Test browser report import and export workflow
        run: node scripts/test_dashboard_site_report.cjs
      - name: Verify trusted LAN binding and default-off capture
        run: python scripts/check_compose_network.py
      - name: Validate worker Compose profile
        run: docker compose --profile capture-worker config --quiet
      - name: Validate opt-in continuous runner Compose profile
        run: docker compose --profile capture-runner config --quiet
      - name: Build opt-in capture worker image
        run: docker compose --profile capture-worker build capture-worker
      - name: Verify nonroot worker persistent-volume permissions
        run: |
          docker compose --profile capture-worker run --rm capture-worker python -c 'from pathlib import Path; p=Path("/data/.write-check"); p.write_text("ok"); p.unlink()'
      - name: Start local Docker API for HTTP smoke
        run: docker compose up -d --build api
      - name: Smoke health, homepage and disabled capture endpoints
        run: python scripts/smoke_http.py
      - name: Smoke authenticated private job API across Docker containers
        run: |
          export SITESCOUT_CAPTURE_ENABLED=true
          export SITESCOUT_JOBS_ENABLED=true
          export SITESCOUT_OPERATOR_TOKEN_HASHES="$(python -c 'import hashlib,json; names={"smoke":"sitescout-smoke-only-operator-token-1234567890","other":"sitescout-smoke-only-outsider-token-1234567890"}; print(json.dumps({name:hashlib.sha256(token.encode()).hexdigest() for name,token in names.items()}))')"
          docker compose up -d --force-recreate api
          docker compose --profile capture-worker run --rm capture-worker python -c 'from app.capture_jobs import CaptureJobStore; CaptureJobStore("/data/capture_jobs.sqlite3").enqueue("smoke", "https://example.org")'
          python scripts/smoke_private_jobs.py
      - name: Stop local Docker API
        if: always()
        run: docker compose down
