name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.15'
      - run: python scripts/check_readme_badges.py
      - run: python -m compileall -q app api scripts tests
      - run: python -m unittest discover -s tests -v
