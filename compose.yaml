services:
  api:
    build: .
    ports:
      - "${SITESCOUT_BIND:-127.0.0.1}:${SITESCOUT_PORT:-8087}:8080"
    environment:
      SITESCOUT_CAPTURE_ENABLED: "${SITESCOUT_CAPTURE_ENABLED:-false}"
      SITESCOUT_CAPTURE_TOKEN: "${SITESCOUT_CAPTURE_TOKEN:-}"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    read_only: true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
networks:
  default:
    ipam:
      config:
        - subnet: 10.253.87.0/24
